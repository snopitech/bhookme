spring.application.name=bhookme-backend
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/bhookme_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cloudflare R2 (S3-compatible) - bhookme's OWN dedicated bucket,
# separate from Snopitech's eStore bucket entirely.
r2.access.key=${BHOOKME_R2_ACCESS_KEY}
r2.secret.key=${BHOOKME_R2_SECRET_KEY}
r2.bucket.name=${BHOOKME_R2_BUCKET_NAME}
r2.endpoint=${BHOOKME_R2_ENDPOINT}
r2.public.url=${BHOOKME_R2_PUBLIC_URL}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Gmail SMTP - bhookme's OWN dedicated Gmail account, not Snopitech's.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${BHOOKME_MAIL_USERNAME}
spring.mail.password=${BHOOKME_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Google Sign-In - bhookme's OWN Google Cloud OAuth client, not Snopitech's.
google.client.id=${BHOOKME_GOOGLE_CLIENT_ID}
google.client.secret=${BHOOKME_GOOGLE_CLIENT_SECRET}

# Microsoft Sign-In - bhookme's OWN Azure App Registration.
# NOTE: property names use bhookme.ms.* (not microsoft.client.*) to
# avoid collision with stray MICROSOFT_CLIENT_ID / MICROSOFT_TENANT_ID
# OS env vars that were left on this machine by a previous session.
# Spring's relaxed binding would otherwise match them and override
# the values from .env.
bhookme.ms.client-id=${BHOOKME_MICROSOFT_CLIENT_ID}
bhookme.ms.tenant-id=${BHOOKME_MICROSOFT_TENANT_ID}
bhookme.ms.client-secret=${BHOOKME_MICROSOFT_CLIENT_SECRET}

# Yahoo Sign-In - bhookme's OWN Yahoo Developer app registration.
# Same bhookme.* prefix pattern as Microsoft to avoid any relaxed-
# binding collision with stray env vars.
bhookme.yahoo.client-id=${BHOOKME_YAHOO_CLIENT_ID}
bhookme.yahoo.client-secret=${BHOOKME_YAHOO_CLIENT_SECRET}
bhookme.yahoo.redirect-uri=${BHOOKME_YAHOO_REDIRECT_URI}

# Frontend base URL used to build the host password-reset link emailed
# to hosts. Defaults to production so prod behavior is unchanged.
# Local dev sets BHOOKME_FRONTEND_URL=http://localhost:5173 in .env to
# make the emailed reset links point at the local frontend.
bhookme.frontend.url=${BHOOKME_FRONTEND_URL:https://bhookme.com}

#noinspection SpringBootApplicationProperties
stripe.api.key=${BHOOKME_STRIPE_API_KEY}
stripe.webhook.secret=${BHOOKME_STRIPE_WEBHOOK_SECRET}

jwt.secret=${BHOOKME_JWT_SECRET}
jwt.expiration.ms=86400000